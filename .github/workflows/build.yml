name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project boringNotch.xcodeproj -scheme boringNotch \
            -configuration Release -derivedDataPath build \
            ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
      - name: Package
        run: |
          cd build/Build/Products/Release
          codesign --force --deep --sign - boringNotch.app
          ditto -c -k --keepParent boringNotch.app "$RUNNER_TEMP/boringNotch.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: boringNotch
          path: ${{ runner.temp }}/boringNotch.zip
