name: Build Custom Boring Notch DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal DMG
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Boring Notch
        run: |
          xcodebuild -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="${PWD}/build/Release" \
            clean build

      - name: Ad-hoc Sign and Package DMG
        run: |
          APP_PATH=$(find "${PWD}/build/Release" -maxdepth 1 -name "*.app" | head -n 1)
          codesign --force --deep --sign - "$APP_PATH"
          mkdir -p dmg_root
          cp -R "$APP_PATH" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "BoringNotch" -srcfolder dmg_root -ov -format UDZO "BoringNotch-Custom.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoringNotch-Custom-DMG
          path: BoringNotch-Custom.dmg
